# Serving environment for the auditor model (gemma-4-31b). Deliberately separate from
# the main env: vLLM 0.29 pins torch==2.13.0, the main env is torch 2.10. Nothing here
# imports package code; the audit process talks to the server over HTTP
# (OpenAI-compatible API).
#
#   uv sync --frozen --project src/multi_objective_mo/audit/auditor
#   bash src/multi_objective_mo/audit/auditor/serve.sh
[project]
name = "agent-audit-auditor"
version = "0.1.0"
description = "vLLM serving env for the audit auditor (gemma-4-31b)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Brings its own torch 2.13 + flashinfer + openai-harmony (gpt-oss chat format), and
    # ninja, which FlashInfer's JIT shells out to (see serve.sh for the PATH setup).
    "vllm==0.29.0",
]

[tool.uv]
# Keep the venv inside this dir so it is obvious which env is which.
package = false
